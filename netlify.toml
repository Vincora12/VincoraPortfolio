# Deploy statico del prototipo.
#
# `npm run build` include `tsc --noEmit`: una regressione di tipi ferma il
# deploy invece di pubblicarlo.
#
# Nessuna regola di redirect SPA: l'app è una pagina sola senza router. Le
# schermate commutano su stato (`phase` / `tab` in `state/store.ts`), non su
# URL, e `?dev=1` è un parametro di query su `/`.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # vite 8 e typescript 7 girano su Node 22, la stessa versione con cui il
  # prototipo è stato verificato. Senza questo Netlify sceglie il suo default.
  NODE_VERSION = "22"

# Gli asset di Vite hanno l'hash nel nome: sono immutabili per definizione.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Il documento no: deve poter cambiare al deploy successivo.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"
