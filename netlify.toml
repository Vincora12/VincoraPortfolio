# Deploy statico del prototipo.
#
# `npm run build` include `tsc --noEmit`: una regressione di tipi ferma il
# deploy invece di pubblicarlo.
#
# Nessuna regola di redirect SPA generica: l'app è una pagina sola senza
# router lato client. Le schermate commutano su stato (`phase` / `tab` in
# `state/store.ts`), non su URL, e `?dev=1` è un parametro di query su `/`.
#
# 🔴 UNA riscrittura c'è, aggiunta dopo: le stanze del laboratorio.
#
# 🔷 «Non si apre la webapp, mi porta sempre a vinz.mon.» `/lab` è un
# DOCUMENTO suo — `lab/index.html`, dichiarato in `vite.config.ts`, che
# Netlify serve da sé perché esiste su disco come `dist/lab/index.html`.
# Serve invece una riga per le stanze (`/lab/creation` e compagne): quelle
# su disco non esistono, e senza questa sarebbero un 404.
#
# ⚠️ PUNTA A `/lab/index.html`, NON A `/index.html`. Mandarle al documento
# dell'app le riporterebbe esattamente al difetto che stiamo correggendo:
# i tag che iOS legge sarebbero di nuovo quelli di VINZ.MON.

[build]
  command = "npm run build"
  publish = "dist"

# ⚠️ DUE REGOLE, E LA PRIMA NON È RIDONDANTE. `/lab/` con la barra finale è
# una cartella, e ogni server statico ci serve `index.html` da sé; `/lab`
# senza barra dipende invece da come quel server tratta i «pretty URL» — su
# `vite preview` cade nel fallback e serve il documento dell'APP, cioè
# esattamente il difetto. Dichiararle entrambe toglie di mezzo la domanda.
[[redirects]]
  from = "/lab"
  to = "/lab/index.html"
  status = 200

[[redirects]]
  from = "/lab/*"
  to = "/lab/index.html"
  status = 200

# 🔷 v1.13 §19 — le funzioni tengono le chiavi, il tetto di spesa e il
# salvataggio. `npm run build` typecheck-a anche loro: una funzione rotta
# ferma il deploy invece di finire in produzione, che e' l'unica strada che
# il browser non puo' aggirare.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 🔷 AGENT.LAB V1 — l'unica funzione che ha bisogno di leggere il progetto
# oltre al proprio grafo di import. `node_bundler = "esbuild"` (sopra)
# impacchetta di norma SOLO quello che una funzione importa staticamente:
# senza questo blocco, `netlify/functions/_shared/agentLabFiles.ts` non
# troverebbe nessun file da leggere una volta deployato. Solo testo, solo le
# cartelle che quel modulo dichiara come consentite (src/netlify/docs) — mai
# `.env*`/`node_modules`/`dist`/`.git`, che questi pattern non toccano
# comunque. È la stessa versione già pubblica su GitHub per questo commit,
# copiata nel pacchetto della funzione — non un accesso live al repository.
[functions."agent-lab"]
  included_files = [
    "src/**/*.ts",
    "src/**/*.tsx",
    "src/**/*.css",
    "netlify/**/*.ts",
    "docs/**/*.md",
    "*.md",
    "package.json",
  ]

[build.environment]
  # vite 8 e typescript 7 girano su Node 22, la stessa versione con cui il
  # prototipo è stato verificato. Senza questo Netlify sceglie il suo default.
  NODE_VERSION = "22"

# Gli asset di Vite hanno l'hash nel nome: sono immutabili per definizione.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Il documento no: deve poter cambiare al deploy successivo.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"
