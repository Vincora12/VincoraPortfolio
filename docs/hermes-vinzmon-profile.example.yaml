# Dedicated Hermes profile for one VINZ.MON Project workspace.
# Replace placeholders before use. Keep this separate from the user's normal
# Hermes profile so Hermes execution state never becomes VINZ.MON product data.

model:
  default: "gpt-oss:20b"
  provider: "custom"
  base_url: "http://127.0.0.1:11434/v1"
  api_key: "ollama"
  # Hermes requires at least a 64k advertised window for agent execution.
  # Per-run VINZ sessions keep the actual prompt far below Ollama's live cap.
  context_length: 131072

terminal:
  backend: "local"
  cwd: "/ABSOLUTE/PATH/TO/THE/FFUOCO/WORKSPACE"
  timeout: 180
  home_mode: "profile"

approvals:
  mode: "manual"
  deny:
    - "*git push*"
    - "*git merge*"
    - "*netlify deploy*"
    - "*vercel deploy*"
    - "*launchctl*"
    - "*systemctl*"
    - "*npm install*"
    - "*npm i *"
    - "*pnpm add*"
    - "*yarn add*"
    - "*pip install*"
    - "*brew install*"

# Never let a missing language server trigger an implicit dependency install.
lsp:
  enabled: true
  install_strategy: "manual"

# vNext CEREBRO boundary: Hermes is the WORK executor only. It keeps session
# continuity for a task, but it must NOT own personal memory or a user profile:
# VINZ.MON is canonical for memory, identity, Projects, Skills and state, and
# exposes structured state through the authenticated vinzmon MCP bridge.
# VINZ.MON refuses to delegate (HERMES_BOUNDARY_UNCONFIRMED) until the Local
# Core environment also sets VINZMON_HERMES_PERSONAL_MEMORY=off.
memory:
  memory_enabled: false
  user_profile_enabled: false
  write_approval: true

skills:
  # vNext: ONLY the enabled-only mirror rebuilt by VINZ.MON (/api/skills).
  # Never point Hermes at data/skills: that also contains disabled skills.
  external_dirs:
    - "/ABSOLUTE/PATH/TO/VinzMon/data/skills-enabled"
  write_approval: true

agent:
  # A failed search must not be able to occupy the only run slot for hundreds
  # of model/tool cycles.
  max_turns: 24
  disabled_toolsets:
    - "web"
    - "browser"
    - "image_gen"
    - "tts"
    - "cronjob"

mcp_servers:
  vinzmon:
    command: "node"
    args: ["/ABSOLUTE/PATH/TO/VinzMon-v2/scripts/hermes-vinz-mcp-server.mjs"]
    env:
      VINZMON_CORE_URL: "http://127.0.0.1:8787"
      VINZMON_TOKEN: "${VINZMON_TOKEN}"
    timeout: 30
    connect_timeout: 10

platform_toolsets:
  api_server: ["terminal", "file", "session_search", "skills", "connections", "vinzmon"]

gateway:
  api_server:
    enabled: true
    host: "127.0.0.1"
    port: 8642
    key: "REPLACE_WITH_A_LONG_RANDOM_LOCAL_API_KEY"
    max_concurrent_runs: 2
