<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <!-- 🔶 Era un globo wireframe col cursore: cioè esattamente il segnaposto
         che iOS disegna quando un'icona NON c'è. Un'icona che si confonde con
         l'assenza di un'icona ha fallito, anche col file a posto.
         Adesso è il SIGILLO, disegnato da `sigilGeometry` come nell'app —
         `scripts/make-icon.mjs` fa tutti i formati da un'unica funzione. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <!-- «Aggiungi a schermata Home» apre a tutto schermo, senza barra del
         browser: sotto gli 860px il frame è già l'intera finestra. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VINZ.MON" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="robots" content="noindex, nofollow" />
    <title>VINZ.MON</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
