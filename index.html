<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- 🔷 «La barra della chat quando scrivo deve stare sopra alla tastiera.»
         `interactive-widget=resizes-content` dice al browser di RIDIMENSIONARE
         la pagina quando sale la tastiera, invece di lasciarla della stessa
         altezza e coprirne il fondo. Così `100dvh` è già l'altezza sopra la
         tastiera, e quello che sta in fondo al flusso ci resta sopra da solo.
         Dove non è supportato non cambia niente rispetto a prima. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <meta name="theme-color" content="#000000" />
    <!-- Marchio VINZ.MON fornito dall’utente. La revisione forza Safari a non
         riusare il vecchio sigillo dalla cache. -->
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=2" />
    <!-- «Aggiungi a schermata Home» apre a tutto schermo, senza barra del
         browser: sotto gli 860px il frame è già l'intera finestra. -->
    <link rel="apple-touch-icon" href="/icon-180.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VINZ.MON" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="robots" content="noindex, nofollow" />
    <title>VINZ.MON</title>
    <style>
      .boot { position: fixed; inset: 0; display: flex; min-height: 100dvh; align-items: center; justify-content: center; gap: 8px; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); background: #000; color: #fff; font: 800 22px/1 system-ui, sans-serif; letter-spacing: -.02em; }
      .boot::after { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: boot-pulse 1.1s ease-in-out infinite; }
      @keyframes boot-pulse { 0%, 100% { opacity: .18; transform: scale(.72); } 50% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .boot::after { animation: none; opacity: .65; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot">VINZ.MON</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
